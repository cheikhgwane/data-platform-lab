# Lab 001: PostgreSQL streaming replication (1 primary, 2 replicas)
x-pg-env: &pg-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}

x-healthcheck: &healthcheck
  # TCP check on purpose: during first init the server only listens on the
  # Unix socket, so this stays unhealthy until the real server is up.
  test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
  interval: 2s
  timeout: 3s
  retries: 30

services:
  pg-primary:
    image: postgres:17
    container_name: pg-primary
    environment:
      <<: *pg-env
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_log_hints=on          # needed later by pg_rewind
      - -c
      - cluster_name=pg_primary   # set on the command line so pg_rewind cannot overwrite it
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./primary/init-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports:
      - "5432:5432"
    healthcheck: *healthcheck

  pg-replica-1:
    image: postgres:17
    container_name: pg-replica-1
    user: postgres
    entrypoint: ["/replica-entrypoint.sh"]
    environment:
      <<: *pg-env
      PRIMARY_HOST: pg-primary
      SLOT_NAME: replica_1
    command:
      - postgres
      - -c
      - hot_standby=on
      - -c
      - wal_log_hints=on
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - cluster_name=pg_replica_1   # becomes application_name in pg_stat_replication
    volumes:
      - replica1-data:/var/lib/postgresql/data
      - ./replica/entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "5433:5432"
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck: *healthcheck

  pg-replica-2:
    image: postgres:17
    container_name: pg-replica-2
    user: postgres
    entrypoint: ["/replica-entrypoint.sh"]
    environment:
      <<: *pg-env
      PRIMARY_HOST: pg-primary
      SLOT_NAME: replica_2
    command:
      - postgres
      - -c
      - hot_standby=on
      - -c
      - wal_log_hints=on
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - cluster_name=pg_replica_2
    volumes:
      - replica2-data:/var/lib/postgresql/data
      - ./replica/entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "5434:5432"
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck: *healthcheck

volumes:
  primary-data:
  replica1-data:
  replica2-data:
